services:
  - type: web
    name: homemart4u-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health?probe=liveness
